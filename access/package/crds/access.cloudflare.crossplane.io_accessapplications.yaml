---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: accessapplications.access.cloudflare.crossplane.io
spec:
  group: access.cloudflare.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - cloudflare
    kind: AccessApplication
    listKind: AccessApplicationList
    plural: accessapplications
    singular: accessapplication
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.atProvider.id
      name: ID
      type: string
    - jsonPath: .spec.forProvider.domain
      name: DOMAIN
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          An AccessApplication is a managed resource representing a Cloudflare Access
          (self-hosted) application.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: An AccessApplicationSpec defines the desired state of an
              AccessApplication.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: |-
                  AccessApplicationParameters define the desired state of a Cloudflare Access
                  application. Only two application types are supported: "self_hosted"
                  (gates a hostname) and "saas" (Cloudflare as an OIDC identity provider for
                  a third-party app) — SAML SaaS, RDP/VNC/SSH browser rendering, App
                  Launcher, and other Access application types are not covered.
                properties:
                  accountId:
                    description: |-
                      AccountID is the Cloudflare account this application belongs to.
                      Immutable after creation — Access applications cannot move between
                      accounts.
                    type: string
                    x-kubernetes-validations:
                    - message: accountId is immutable
                      rule: self == oldSelf
                  additionalDomains:
                    description: |-
                      AdditionalDomains lists extra self-hosted hostnames gated by this same
                      application alongside Domain — e.g. a wildcard subdomain sharing one
                      Access app and policy set with its parent domain. Applies to
                      type=self_hosted only.
                    items:
                      type: string
                    type: array
                  domain:
                    description: |-
                      Domain is the hostname (and optional path) secured by this application,
                      e.g. "app.example.com". This is what Access actually gates — typically
                      a hostname already routed through a Cloudflare Tunnel. Applies to
                      type=self_hosted only; ignored (and unused) for type=saas, whose domain
                      is a Cloudflare-hosted OIDC issuer path assigned automatically.
                    type: string
                  httpOnlyCookieAttribute:
                    description: |-
                      HTTPOnlyCookieAttribute enables the HttpOnly flag on Access's session
                      cookie, preventing client-side JS from reading it. Cloudflare defaults
                      to true. Applies to type=self_hosted only. Left unset, this is
                      late-initialized from the live application's current value on first
                      Observe — Cloudflare treats an omitted value as "reset to default" on
                      every Update, not "leave unchanged", so once adopted this is always
                      resent explicitly.
                    type: boolean
                  name:
                    description: |-
                      Name of the application, shown in the Zero Trust dashboard. Falls back
                      to this resource's own Kubernetes name if unset.
                    type: string
                  oidc:
                    description: |-
                      OIDC configures this application as an OIDC identity provider. Required
                      when type=saas; ignored for type=self_hosted.
                    properties:
                      accessTokenLifetime:
                        description: AccessTokenLifetime, e.g. "5m". Cloudflare applies
                          its own default if unset.
                        type: string
                      appLauncherVisible:
                        description: AppLauncherVisible displays the application in
                          the App Launcher.
                        type: boolean
                      grantTypes:
                        description: |-
                          GrantTypes this application supports, e.g. "authorization_code",
                          "refresh_tokens". Not validated here — Cloudflare's API is the source
                          of truth for valid values.
                        items:
                          type: string
                        type: array
                      redirectUris:
                        description: |-
                          RedirectURIs Cloudflare is permitted to send Authorization codes and
                          Access/ID tokens to.
                        items:
                          type: string
                        minItems: 1
                        type: array
                      refreshTokenLifetime:
                        description: RefreshTokenLifetime, e.g. "90d". Omit to disable
                          refresh tokens.
                        type: string
                      scopes:
                        description: |-
                          Scopes shared with this application, e.g. "openid", "email", "profile",
                          "groups". Not validated here — Cloudflare's API is the source of truth
                          for valid values.
                        items:
                          type: string
                        type: array
                    required:
                    - redirectUris
                    type: object
                  policyIdRefs:
                    description: PolicyIDRefs reference Policy resources to resolve
                      policyIds from, in order.
                    items:
                      description: A Reference to a named object.
                      properties:
                        name:
                          description: Name of the referenced object.
                          type: string
                        policy:
                          description: Policies for referencing.
                          properties:
                            resolution:
                              default: Required
                              description: |-
                                Resolution specifies whether resolution of this reference is required.
                                The default is 'Required', which means the reconcile will fail if the
                                reference cannot be resolved. 'Optional' means this reference will be
                                a no-op if it cannot be resolved.
                              enum:
                              - Required
                              - Optional
                              type: string
                            resolve:
                              description: |-
                                Resolve specifies when this reference should be resolved. The default
                                is 'IfNotPresent', which will attempt to resolve the reference only when
                                the corresponding field is not present. Use 'Always' to resolve the
                                reference on every reconcile.
                              enum:
                              - Always
                              - IfNotPresent
                              type: string
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  policyIdSelector:
                    description: PolicyIDSelector selects Policy resources to resolve
                      policyIds from.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  policyIds:
                    description: |-
                      PolicyIDs are the reusable Policy IDs attached to this application, in
                      evaluation order (first match wins). Either this or
                      policyIdRefs/policyIdSelector must resolve to at least one value.
                    items:
                      type: string
                    type: array
                  sessionDuration:
                    description: |-
                      SessionDuration tokens issued for this application remain valid for,
                      e.g. "24h". Cloudflare defaults to 24h if unset. Applies to
                      type=self_hosted only.
                    type: string
                  type:
                    default: self_hosted
                    description: Type of application. Immutable after creation.
                    enum:
                    - self_hosted
                    - saas
                    type: string
                    x-kubernetes-validations:
                    - message: type is immutable
                      rule: self == oldSelf
                required:
                - accountId
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  This field is planned to replace the DeletionPolicy field in a future
                  release. Currently, both could be set independently and non-default
                  values would be honored if the feature flag is enabled. If both are
                  custom, the DeletionPolicy field will be ignored.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
                        default: Required
                        description: |-
                          Resolution specifies whether resolution of this reference is required.
                          The default is 'Required', which means the reconcile will fail if the
                          reference cannot be resolved. 'Optional' means this reference will be
                          a no-op if it cannot be resolved.
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        description: |-
                          Resolve specifies when this reference should be resolved. The default
                          is 'IfNotPresent', which will attempt to resolve the reference only when
                          the corresponding field is not present. Use 'Always' to resolve the
                          reference on every reconcile.
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              publishConnectionDetailsTo:
                description: |-
                  PublishConnectionDetailsTo specifies the connection secret config which
                  contains a name, metadata and a reference to secret store config to
                  which any connection details for this managed resource should be written.
                  Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  configRef:
                    default:
                      name: default
                    description: |-
                      SecretStoreConfigRef specifies which secret store config should be used
                      for this ConnectionSecret.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  metadata:
                    description: Metadata is the metadata for connection secret.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          Annotations are the annotations to be added to connection secret.
                          - For Kubernetes secrets, this will be used as "metadata.annotations".
                          - It is up to Secret Store implementation for others store types.
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          Labels are the labels/tags to be added to connection secret.
                          - For Kubernetes secrets, this will be used as "metadata.labels".
                          - It is up to Secret Store implementation for others store types.
                        type: object
                      type:
                        description: |-
                          Type is the SecretType for the connection secret.
                          - Only valid for Kubernetes Secret Stores.
                        type: string
                    type: object
                  name:
                    description: Name is the name of the connection secret.
                    type: string
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                  This field is planned to be replaced in a future release in favor of
                  PublishConnectionDetailsTo. Currently, both could be set independently
                  and connection details would be published to both without affecting
                  each other.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
          status:
            description: An AccessApplicationStatus reflects the observed state of
              an AccessApplication.
            properties:
              atProvider:
                description: AccessApplicationObservation reflects the observed state
                  of a Cloudflare Access application.
                properties:
                  aud:
                    description: AUD is the application's audience tag, used by origins
                      to verify Access JWTs.
                    type: string
                  clientId:
                    description: ClientID is the OIDC client ID Cloudflare assigned.
                      Only set for type=saas.
                    type: string
                  id:
                    description: ID is the Cloudflare Access application ID (UUID).
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
