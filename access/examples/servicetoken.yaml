# A service token for a CLI/automation client. The Client ID and Secret land in
# the connection secret (keys clientId, clientSecret); send them as the
# CF-Access-Client-Id / CF-Access-Client-Secret headers. Pair it with an
# Access policy that admits service tokens (decision nonIdentity, include
# {anyValidServiceToken: true}). Delete the connection secret to rotate.
apiVersion: access.cloudflare.crossplane.io/v1alpha1
kind: ServiceToken
metadata:
  name: example-cli
spec:
  forProvider:
    accountId: REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID
    name: example-cli
    # duration: 8760h     # default (one year), late-initialized from Cloudflare
    # renewBefore: 720h   # default: extend the expiry 30 days before it (same secret)
  writeConnectionSecretToRef:
    namespace: crossplane-system
    name: example-cli-service-token
  providerConfigRef:
    name: default
