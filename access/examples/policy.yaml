apiVersion: access.cloudflare.crossplane.io/v1alpha1
kind: Policy
metadata:
  name: example-company-only
spec:
  forProvider:
    accountId: REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID
    name: example-company-only
    decision: allow
    include:
      - emailDomain: example.com
      # Other supported rule kinds: {everyone: true}, {email: "user@example.com"},
      # {ipRange: "203.0.113.0/24"}, {anyValidServiceToken: true}
  providerConfigRef:
    name: default
---
# A "bypass" policy for a webhook endpoint that shouldn't require a login —
# also usable as a "nonIdentity" policy (e.g. gating on a service token only)
# by changing decision and include accordingly.
apiVersion: access.cloudflare.crossplane.io/v1alpha1
kind: Policy
metadata:
  name: example-webhook-bypass
spec:
  forProvider:
    accountId: REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID
    name: example-webhook-bypass
    decision: bypass
    include:
      - everyone: true
  providerConfigRef:
    name: default
