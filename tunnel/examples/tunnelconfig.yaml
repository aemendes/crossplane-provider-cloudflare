apiVersion: tunnel.cloudflare.crossplane.io/v1alpha1
kind: TunnelConfig
metadata:
  name: example-tunnel-config
spec:
  forProvider:
    accountId: REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID
    tunnelIdRef:
      name: example-tunnel
    ingress:
      - hostname: app.example.com
        service: http://localhost:8080
      # Mandatory trailing catch-all — Cloudflare rejects a config without one.
      - service: "http_status:404"
  providerConfigRef:
    name: default
