apiVersion: tunnel.cloudflare.crossplane.io/v1alpha1
kind: Tunnel
metadata:
  name: example-tunnel
spec:
  forProvider:
    accountId: REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID
    name: example-tunnel
  writeConnectionSecretToRef:
    namespace: crossplane-system
    name: example-tunnel-conn
  providerConfigRef:
    name: default
